<!DOCTYPE html>
<html>
<head>
  <script src="icons.js"></script>
  <title>Receipt History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){try{if(localStorage.getItem('ssm_dark')==='1')document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <script src="receipt.js"></script>

  <script src="firebase-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5b3b8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sone Sone Mommy">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}</script>
  <script>(function(){try{document.documentElement.classList.add('role-'+(localStorage.getItem('ssm_role')||'staff'));}catch(e){}})();</script>
  <style>
    :root{
      --bg:#dad3f5; --bg-2:#c7bdec; --bg-3:#e3dcf7; --surface:#ffffff; --line:#e3daf6; --line-2:#d3c5ef;
      --ink:#2b2b2b; --ink-2:#6c5f94; --ink-3:#948aba;
      --brand:#4f3393; --brand-ink:#3a2470; --brand-tint:#efe9fb; --brand-line:#dccdf5;
      --green:#3fae6a; --green-tint:#eaf8f0; --green-line:#bfe9cd;
      --red:#e45b67; --red-tint:#fdeef0; --red-line:#f9d2d6;
      --amber:#f4b942; --amber-tint:#fff6e2; --amber-line:#f3d488; --amber-ink:#93690a;
      --blue:#6a8dff; --blue-tint:#edf1ff; --blue-line:#c9d6ff;
      --teal:#8e72c7; --teal-tint:#f3eefc; --teal-line:#cdb6f5;
      --r:20px; --r-sm:16px;
      --shadow:0 1px 2px rgba(47,35,89,.06), 0 8px 22px rgba(47,35,89,.10);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; }
    body{
      font-family:system-ui,'Noto Sans Myanmar','Padauk','Myanmar Text','Segoe UI',sans-serif;
      background:linear-gradient(160deg, var(--bg-2) 0%, var(--bg) 45%, var(--bg-3) 100%);
      background-attachment:fixed;
      color:var(--ink); line-height:1.5; padding:0 0 30px 0;
      -webkit-text-size-adjust:100%;
    }

    .top-bar{
      position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
      padding:11px 12px; margin:0; background:#F3EEFF;
      backdrop-filter:saturate(150%) blur(10px); -webkit-backdrop-filter:saturate(150%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    #menuBtn{ background:var(--surface); border:none; box-shadow:var(--shadow); font-size:23px; line-height:1; color:var(--ink);
      cursor:pointer; padding:6px 9px; border-radius:14px;
      -webkit-tap-highlight-color:transparent; outline:none; -webkit-user-select:none; user-select:none; }
    #menuBtn:active{ background:var(--line); }
    #menuBtn:focus, #menuBtn:focus-visible{ outline:none; box-shadow:none; }
    .top-bar .top-title{ margin:0; font-size:16px !important; font-weight:700; letter-spacing:-.01em;
      color:var(--brand); flex:none; white-space:nowrap; }

    h1{ font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
      color:var(--ink-3); margin:16px 16px 8px; }

    .header-search{
      flex:1 1 auto; min-width:0; display:flex; align-items:center;
      background:var(--surface); border:1px solid var(--line-2); border-radius:999px;
      padding:3px; transition:border-color .15s, box-shadow .15s;
    }
    .header-search:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,51,147,.13); }
    #searchBox{ flex:1 1 auto; min-width:0; display:block; width:auto; margin:0; padding:8px 4px 8px 14px;
      font-size:14px; color:var(--ink); background:transparent; border:none;
      outline:none; -webkit-appearance:none; appearance:none; }
    #searchBtn{ flex:none; width:34px; height:34px; margin-right:1px; padding:0; border:none; border-radius:50%;
      background:var(--surface); box-shadow:var(--shadow); color:var(--ink); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent; outline:none; -webkit-user-select:none; user-select:none; }
    #searchBtn svg{ width:19px; height:19px; display:block; }
    #searchBtn:active{ opacity:.55; }
    #searchBtn:focus, #searchBtn:focus-visible{ outline:none; box-shadow:none; }
    ::placeholder{ color:var(--ink-3); }

    #rfilter{ margin:14px 14px 14px; }
    .rpillnav{ position:relative; background:var(--surface); border:1px solid var(--line-2);
      border-radius:999px; padding:3px; margin-bottom:9px; box-shadow:var(--shadow); }
    .rpillnav-scroll{ position:relative; display:flex; align-items:center; flex-wrap:nowrap; gap:1px; overflow-x:hidden; }
    .rpillnav-thumb{ position:absolute; top:0; left:0; height:100%; width:0;
      background:var(--brand); border-radius:999px; z-index:0; pointer-events:none;
      transition:transform .32s cubic-bezier(.4,0,.2,1), width .32s cubic-bezier(.4,0,.2,1); }
    .rchip{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center;
      flex:1 1 0; min-width:0; overflow:hidden;
      white-space:nowrap;
      border:none; background:transparent; color:var(--ink-2);
      border-radius:999px; padding:4.5px 10px; font-size:13.5px; font-weight:600; cursor:pointer;
      -webkit-tap-highlight-color:transparent; transition:color .2s ease; }
    .rchip b{ display:inline-flex; align-items:center; justify-content:center;
      background:var(--brand-tint); color:var(--brand); border-radius:999px;
      padding:0 5px; height:14px; font-size:9.5px; font-weight:800; min-width:14px; text-align:center;
      opacity:0; transform:scale(.5); max-width:0; margin-left:0; overflow:hidden;
      transition:opacity .22s ease, transform .22s ease, max-width .22s ease, margin-left .22s ease,
        background .2s ease, color .2s ease; }
    .rchip.active{ background:transparent; color:#fff; border-color:transparent; }
    .rchip.active b{ opacity:1; transform:scale(1); max-width:32px; margin-left:7px;
      background:rgba(255,255,255,.24); color:#fff; }
    .rdates{ display:flex; gap:8px; align-items:center; }
    .rdate{ flex:1; display:flex; min-width:0; }
    .rdate-box{ position:relative; display:flex; align-items:center; width:100%;
      padding:9px 32px 9px 10px; border-radius:var(--r-sm); border:1px solid var(--line-2);
      background:var(--surface); font-family:inherit; box-sizing:border-box; font-size:13px;
      overflow:hidden; white-space:nowrap; transition:border-color .15s, box-shadow .15s; }
    .rdate-box:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(79,51,147,.13); }
    .rdate-label{ flex:none; color:var(--ink-3); font-weight:600; }
    .rdate-sep{ flex:none; color:var(--line-2); margin:0 6px; }
    .rdate-value{ flex:1 1 auto; min-width:0; color:var(--ink); font-weight:600;
      overflow:hidden; text-overflow:ellipsis; }
    .rdate-icon{ position:absolute; right:9px; top:50%; transform:translateY(-50%);
      width:15px; height:15px; color:var(--ink-3); pointer-events:none; }
    .rdate-native{ position:absolute; inset:0; width:100%; height:100%; opacity:0;
      border:0; margin:0; padding:0; font-size:16px; cursor:pointer;
      -webkit-appearance:none; appearance:none; }
    .rclear{ flex:0 0 auto; width:42px; height:39px; border-radius:var(--r-sm); border:1px solid var(--line-2);
      background:var(--surface); color:var(--ink-2); cursor:pointer; font-size:15px; -webkit-tap-highlight-color:transparent; }

    #historyList{ padding:14px 14px 0; }

    /* receipt card */
    .card{ position:relative; isolation:isolate; overflow:hidden;
      background:var(--surface);
      border:1px solid var(--line); border-radius:var(--r);
      margin-bottom:10px; box-shadow:var(--shadow); }
    .card::before{ content:none; }
    /* Shop-mode sales — full-card gradient using the exact same color income.html
       assigns to "Shop" (🛒), so shop receipts look like income's day-card at a
       glance. Collapsed summary gets the color + white text; expanded detail
       stays on a plain surface so the item list/buttons remain readable. */
    .card.card-shop{
      background:linear-gradient(135deg, #6d28d9 0%, rgb(170,130,233) 100%);
      border-color:transparent;
    }
    .card.card-shop .summary-left h3{ color:#fff; }
    .card.card-shop .summary-left p{ color:rgba(255,255,255,.8); }
    .card.card-shop .summary-right .net{ color:#fff; }
    .card.card-shop .summary-right .order-no{ color:rgba(255,255,255,.75); }
    .card.card-shop .badge{ background:rgba(255,255,255,.22); color:#fff; border-color:rgba(255,255,255,.3); }
    .card.card-shop .card-detail{ background:var(--surface); border-top:none;
      border-radius:0 0 var(--r) var(--r); }
    .card-summary{ display:flex; justify-content:space-between; align-items:flex-start;
      gap:12px; padding:13px 14px; cursor:pointer; }
    .summary-left{ min-width:0; }
    .summary-left h3{ margin:0 0 3px; font-size:15px; font-weight:700; color:var(--ink); }
    .summary-left p{ margin:2px 0; font-size:12.5px; color:var(--ink-3); }
    .summary-right{ text-align:right; min-width:92px; flex:none; }
    .summary-right .net{ font-weight:800; font-size:16px; color:var(--brand-ink); letter-spacing:-.01em; }
    .summary-right .order-no{ font-size:11px; color:var(--ink-3); margin-top:3px; }

    /* badges */
    .badge{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px;
      font-weight:700; margin-top:5px; margin-right:4px; border:1px solid transparent; }
    .badge-printed{ background:var(--green-tint); color:var(--green); border-color:var(--green-line); }
    .badge-notprinted{ background:var(--red-tint); color:var(--red); border-color:var(--red-line); }
    .badge-cod{ background:var(--amber-tint); color:var(--amber); border-color:var(--amber-line); }
    .badge-cash{ background:rgba(13,148,136,.14); color:#0d9488; border-color:rgba(13,148,136,.35); }
    .badge-prepaid{ background:var(--blue-tint); color:var(--blue); border-color:var(--blue-line); }
    .badge-partial{ background:var(--brand-tint); color:var(--brand-ink); border-color:var(--brand-line); }

    /* detail */
    .card-detail{ display:none; padding:4px 14px 14px; border-top:1px solid var(--line); }
    .info-line{ font-size:13px; margin:7px 0; color:var(--ink-2); }
    .info-line b{ color:var(--ink); font-weight:600; }
    .items-box{ background:var(--bg); border:1px solid var(--line); border-radius:10px;
      padding:11px 12px; margin:11px 0; font-size:13px; color:var(--ink-2); }
    .items-box b{ color:var(--ink); }
    .items-box p{ margin:5px 0; }

    .actions{ display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; }
    .btn{ position:relative; overflow:hidden; isolation:isolate;
      border:none; padding:10px 12px; border-radius:var(--r-sm); color:#fff; font-size:13px;
      font-weight:600; cursor:pointer; flex:1; min-width:74px; font-family:inherit;
      transition:transform .05s; display:inline-flex; align-items:center; justify-content:center; gap:5px;
      box-shadow:0 2px 6px rgba(47,35,89,.25), inset 0 1px 0 rgba(255,255,255,.35); }
    .btn::before{ content:none; }
    .btn:active{ transform:translateY(1px); }
    .btn .ssm-icon{ flex:none; }
    .btn-payment{ background:linear-gradient(180deg, #a68ddb 0%, #8e72c7 55%, #7458ab 100%); }
    .btn-print{ background:linear-gradient(180deg, #6b4bb0 0%, #4f3393 55%, #3a2470 100%); }
    .btn-edit{ background:linear-gradient(180deg, var(--surface) 0%, var(--amber-tint) 100%);
      color:var(--amber-ink, #93690a); border:1px solid var(--amber-line);
      box-shadow:none; }
    .btn-delete{ background:linear-gradient(180deg, var(--surface) 0%, var(--red-tint) 100%);
      color:var(--red); border:1px solid var(--red-line); box-shadow:none; }

    /* popup */
    .popup-overlay{ position:fixed; inset:0; z-index:10000; padding:24px; display:none;
      align-items:center; justify-content:center; background:rgba(15,17,25,.5);
      backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
    .popup-overlay.show{ display:flex; }
    .popup-card{ width:100%; max-width:320px; background:var(--surface); border:1px solid var(--line);
      border-radius:18px; padding:22px 20px 18px; box-shadow:0 22px 55px rgba(0,0,0,.3); text-align:center;
      transform:translateY(10px) scale(.96); opacity:0; transition:transform .18s ease, opacity .18s ease; }
    .popup-overlay.show .popup-card{ transform:none; opacity:1; }
    .popup-icon{ width:48px; height:48px; margin:0 auto 13px; border-radius:50%; display:flex;
      align-items:center; justify-content:center; font-size:24px; background:var(--brand-tint); border:1px solid var(--brand-line); }
    .popup-msg{ font-size:15px; font-weight:600; color:var(--ink); line-height:1.55; margin:0 0 18px; }
    .popup-actions{ display:flex; gap:9px; }
    .popup-actions button{ flex:1; font-family:inherit; font-size:15px; font-weight:600; color:#fff;
      background:var(--brand); border:none; border-radius:var(--r-sm); padding:12px; cursor:pointer; }
    .popup-cancel{ background:var(--surface) !important; color:var(--ink-2) !important; border:1px solid var(--line-2) !important; }

    /* slide menu */
    #menuOverlay{ display:none; position:fixed; inset:0; background:rgba(15,17,25,.45); z-index:9998; }
    #sideMenu{ position:fixed; top:0; left:-300px; width:284px; height:100%; background:var(--surface);
      z-index:9999; transition:left .25s ease; overflow-y:auto; box-shadow:8px 0 34px rgba(16,24,40,.18); }
    #sideMenu.open{ left:0; }
    #menuOverlay.open{ display:block; }
    .menu-header{ padding:26px 20px 22px; color:#fff; background:linear-gradient(135deg, var(--brand-ink), var(--brand)); }
    .menu-header h2{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em; }
    .menu-header p{ margin:5px 0 0; font-size:12px; color:rgba(255,255,255,.82); }
    .menu-item{ display:flex; align-items:center; gap:13px; margin:5px 8px; padding:9px 11px;
      border-radius:12px; color:var(--ink); cursor:pointer; font-size:15px; font-weight:500; }
    .menu-item:first-of-type{ margin-top:9px; }
    .menu-item:active{ background:var(--line); }
    .menu-item.active{ background:var(--brand-tint); color:var(--brand-ink); font-weight:700; }
    .menu-item .ic{ width:38px; height:38px; flex:none; border-radius:10px; display:flex; align-items:center;
      justify-content:center; font-size:18px; background:var(--brand-tint); border:1px solid var(--brand-line); }
    .menu-item.active .ic{ background:var(--surface); }

    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
    /* WIDE-SCREEN — 2-column grid on tablets, 1-column on phones */
    @media (min-width:700px){
      h1 { max-width:920px; margin-left:auto; margin-right:auto; }
      #historyList { max-width:920px; margin-left:auto; margin-right:auto;
        display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
      #historyList > .card{ margin-bottom:0; }
    }
    .items-box .ritem{ padding:7px 0; border-bottom:1px dashed var(--line-2); }
    .items-box .ritem:last-child{ border-bottom:none; }
    .items-box .ritem-name{ font-weight:700; font-size:13.5px; color:var(--ink); }
    .items-box .ritem-sub{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--ink-2); margin-top:1px; }
    .items-box .ritem-sub span:last-child{ font-weight:700; color:var(--brand-ink); white-space:nowrap; }
    .items-box .ritem-remark{ font-size:12px; color:var(--ink-3); margin-top:1px; }
    html.role-staff .btn-delete{ display:none !important; }
    #ssModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:9999;
      flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    #ssModalImg{ max-width:100%; max-height:80vh; object-fit:contain; border-radius:12px; }
    #ssModal button{ margin-top:20px; padding:12px 24px; border-radius:var(--r-sm); border:none;
      background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; }

    /* ── Online Payment: summary chips + full-screen modal (embeds payments.html) ── */
    .btn-onlinepay{ background:linear-gradient(180deg, #6b4bb0 0%, #4f3393 55%, #3a2470 100%); }
    .pay-summary-box{
      margin-top:11px; padding:12px 13px; border-radius:var(--r-sm);
      background:var(--brand-tint); border:1px solid var(--brand-line);
    }
    .pay-summary-total{
      display:flex; align-items:center; justify-content:space-between;
      font-size:13.5px; font-weight:700; color:var(--brand-ink);
      margin:0 0 8px 0;
    }
    .pay-summary-chips{ display:flex; flex-wrap:wrap; gap:7px; }
    .pay-summary-chip{
      display:inline-flex; align-items:center; gap:5px;
      font-size:12px; font-weight:600; color:var(--ink-2);
      background:var(--surface); border:1px solid var(--line-2); border-radius:999px;
      padding:5px 11px; white-space:nowrap;
    }
    .pay-summary-chip b{ color:var(--ink); }
    .pay-modal-overlay{
      position:fixed; inset:0; z-index:9997;
      background:rgba(15,17,23,.4);
      opacity:0; pointer-events:none;
      transition:opacity .28s ease;
      display:flex; align-items:flex-end; justify-content:center;
    }
    .pay-modal-overlay.show{ opacity:1; pointer-events:auto; }
    .pay-modal-sheet{
      width:100%; max-width:600px; height:100%;
      background:var(--bg);
      display:flex; flex-direction:column;
      transform:translateY(100%);
      transition:transform .32s cubic-bezier(.32,.72,0,1);
      box-shadow:0 -8px 30px rgba(16,24,40,.18);
    }
    .pay-modal-overlay.show .pay-modal-sheet{ transform:translateY(0); }
    .pay-modal-head{
      flex:none; display:flex; align-items:center; gap:8px;
      padding:13px 14px; padding-top:calc(13px + env(safe-area-inset-top, 0px));
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(150%) blur(10px); -webkit-backdrop-filter:saturate(150%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .pay-modal-head h2{ margin:0; flex:1; font-size:16px; font-weight:700; letter-spacing:-.01em; }
    .pay-modal-close{
      flex:none; background:none; border:none; font-size:19px; color:var(--ink-2);
      cursor:pointer; padding:7px 10px; border-radius:10px; line-height:1;
    }
    .pay-modal-close:active{ background:var(--line); }
    .pay-modal-body{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .pay-modal-body iframe{ width:100%; height:100%; border:none; display:block; background:var(--bg); }
    .popup-input{ background:var(--surface); color:var(--ink); border:1px solid var(--line-2); }

    /* ===== Dark mode (toggled via html.dark) ===== */
    html.dark{
      --bg:#0f1116; --bg-2:#14161d; --bg-3:#191c25; --surface:#181b22; --line:#252a33; --line-2:#333a46;
      --ink:#e8eaef; --ink-2:#aab1bd; --ink-3:#727a87;
      --brand:#8b5cf6; --brand-ink:#c4b5fd; --brand-tint:#1d1930; --brand-line:#352c57;
      --green:#22c55e; --green-tint:#10271a; --green-line:#1f4a32;
      --red:#f87171; --red-tint:#2a1414; --red-line:#5c2b2b;
      --amber:#e0b84e; --amber-tint:#272010; --amber-line:#544619; --amber-ink:#f2d17a;
      --blue:#93b4fb; --blue-tint:#172033; --blue-line:#2c3c5c;
      --teal:#5fd0e6; --teal-tint:#183330; --teal-line:#265048;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
    html.dark .top-bar{ background:rgba(18,20,26,.82); }
    html.dark .pay-modal-head{ background:rgba(18,20,26,.92); }
    html.dark input, html.dark select, html.dark textarea{ background-color:#1e222a; }
    html.dark input:focus, html.dark select:focus, html.dark textarea:focus{ box-shadow:0 0 0 3px rgba(139,92,246,.22); }
    html.dark .badge-cash{ background:rgba(13,148,136,.18); color:#5eead4; border-color:rgba(94,234,212,.35); }
  </style>
</head>

<body>

  
  <!-- Slide Menu -->
  <div id="menuOverlay" onclick="closeMenu()"></div>
  <div id="sideMenu">
    <div class="menu-header">
      <h2>Sone Sone Mommy</h2>
      <p>POS System</p>
    </div>
    <div class="menu-item" data-page="report.html"   onclick="location.href='report.html'"><span class="ic" data-icon="report" data-icon-size="20"></span> စာရင်းချုပ်</div>
    <div class="menu-item admin-only" data-page="income.html"   onclick="location.href='income.html'"><span class="ic" data-icon="income" data-icon-size="20"></span> Delivery ဆီမှရငွေ</div>
    <div class="menu-item" data-page="index.html"    onclick="location.href='index.html'"><span class="ic" data-icon="cart" data-icon-size="20"></span> အရောင်း (Sales)</div>
    <div class="menu-item" data-page="receipts.html" onclick="location.href='receipts.html'"><span class="ic" data-icon="receipt" data-icon-size="20"></span> ဘောင်ချာများ</div>
    <div class="menu-item" data-page="delivery.html" onclick="location.href='delivery.html'"><span class="ic" data-icon="delivery" data-icon-size="20"></span> ပို့ဆောင်ရေး</div>
    <div class="menu-item" data-page="payments.html" onclick="location.href='payments.html'"><span class="ic" data-icon="cash" data-icon-size="20"></span> ငွေလွှဲစာရင်း</div>
    <div class="menu-item admin-only" data-page="products.html" onclick="location.href='products.html'"><span class="ic" data-icon="package" data-icon-size="20"></span> ပစ္စည်းများ</div>
    <div class="menu-item admin-only" data-page="staff.html"    onclick="location.href='staff.html'"><span class="ic" data-icon="user" data-icon-size="20"></span> ဝန်ထမ်းများ</div>
    <div class="menu-item" data-page="setting.html" onclick="location.href='setting.html'"><span class="ic" data-icon="settings" data-icon-size="20"></span> Settings</div>
  </div>

  <div class="top-bar">
    <button id="menuBtn" onclick="openMenu()">⋮</button>
    <span class="top-title" style="font-size:18px;font-weight:bold;">ဘောင်ချာများ</span>
    <div class="header-search">
      <input id="searchBox" placeholder="Search Order No / Customer" oninput="applyFilters()">
      <button type="button" id="searchBtn" aria-label="Search" onclick="applyFilters(); document.getElementById('searchBox').focus();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <line x1="20" y1="20" x2="15.3" y2="15.3"></line>
        </svg>
      </button>
    </div>
  </div>


  <div id="historyList"></div>

  <div id="loadMoreWrap" style="max-width:920px;margin:14px auto 24px;padding:0 14px;text-align:center;">
    <button id="loadMoreBtn" class="btn btn-payment" style="width:auto;padding:11px 22px;" onclick="loadMoreReceipts()"><span data-icon="refresh" data-icon-size="16"></span> နောက်ထပ် ၂၀ ရက်စာ ကြည့်ရန်</button>
    <p id="loadMoreNote" style="font-size:12.5px;color:var(--ink-3);margin-top:8px;"></p>
  </div>

  <!-- SS Modal -->
  <div id="ssModal">
    <img id="ssModalImg">
    <button onclick="closeSS()"><span data-icon="close" data-icon-size="16"></span> Close</button>
  </div>

  <!-- Online Payment modal (embeds payments.html, same as index.html) -->
  <div class="pay-modal-overlay" id="onlinePayModalOverlay" onclick="if(event.target===this) closeOnlinePaymentModal()">
    <div class="pay-modal-sheet" role="dialog" aria-modal="true" aria-label="Online Payment">
      <div class="pay-modal-head">
        <h2><span data-icon="card" data-icon-size="18"></span> Online Payment</h2>
        <button type="button" class="pay-modal-close" onclick="closeOnlinePaymentModal()" aria-label="Close"><span data-icon="close" data-icon-size="16"></span></button>
      </div>
      <div class="pay-modal-body">
        <iframe id="onlinePayModalFrame" title="Online Payment" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>

    // icons.js မ load ဖြစ်ရင် (network/404) သို့ icon နာမည် မသိရင်တောင် render loop မကျိုးအောင် fallback
    if (typeof window.ssmIcon !== "function") {
      window.ssmIcon = function (name) {
        var map = { edit: "✏️", trash: "🗑️", add: "＋", print: "🖨️", share: "📤" };
        return map[name] || "";
      };
    }

    let salesHistory = JSON.parse(localStorage.getItem("salesHistory")) || [];

    let openIndex    = null;

    // ── Render List ───────────────────────────────────────────────
    function renderHistory() {
      salesHistory = JSON.parse(localStorage.getItem("salesHistory")) || [];
      let html = "";

      if (salesHistory.length === 0) {
        html = `<p style="color:#9ca3af; text-align:center; margin-top:40px;">Receipt မရှိသေးပါ။</p>`;
      }

      var _allPayRecords = JSON.parse(localStorage.getItem("paymentsList")) || [];
      // A payment can be split across multiple orders — this returns its
      // {orderNo: amount} share map, migrating legacy single-order records.
      function _allocMap(p) {
        if (!p.allocations) {
          p.allocations = {};
          if (p.linkedSaleId) p.allocations[p.linkedSaleId] = Number(p.amount) || 0;
        }
        return p.allocations;
      }

      salesHistory
        .map(function (sale, index) { return { sale: sale, index: index }; })
        .reverse() // အသစ်ဆုံး အပေါ်ဆုံး
        .forEach(function (o) {
        var sale = o.sale, index = o.index;
        let itemHtml = "";
        if (sale.items) {
          sale.items.forEach(function (item) {
            let giftTag = item.isGift ? " " + ssmIcon("gift",{size:12}) : "";
            let repTag  = item.repPrice ? " " + ssmIcon("tag",{size:12}) : "";
            let wsub = item.saleType === "weight"
              ? (item.weightText ? item.weightText : ((item.size || "") + " | " + item.qty + " x " + item.price))
              : ((item.isGift ? "လက်ဆောင် | " : (item.size ? item.size + " | " : "")) + item.qty + " x " + item.price);
            itemHtml += `<div class="ritem"><div class="ritem-name">${item.product}${giftTag}${repTag}</div><div class="ritem-sub"><span>${wsub}</span><span>${item.total}</span></div>${item.remark ? `<div class="ritem-remark">→ ${item.remark}</div>` : ""}</div>`;
          });
        }

        // Online Payment summary (payments.html records linked to this receipt)
        var _linkedPays = (sale.linkedPayments || [])
          .map(function (pid) { return _allPayRecords.find(function (p) { return p.id === pid; }); })
          .filter(Boolean)
          .map(function (p) {
            var m = _allocMap(p);
            var amt = (m[sale.orderNo] != null) ? Number(m[sale.orderNo]) : (Number(p.amount) || 0);
            return { p: p, amt: amt };
          })
          .filter(function (x) { return x.amt > 0; });
        var paySummaryHtml = "";
        if (_linkedPays.length) {
          var _payTotal = _linkedPays.reduce(function (s, x) { return s + x.amt; }, 0);
          var _chips = _linkedPays.map(function (x) {
            var _mLabel = x.p.method === "Bank" ? "ဘဏ်လွှဲ" : (x.p.method || "အခြား");
            return '<span class="pay-summary-chip">' + _mLabel + ' • <b>' + x.amt.toLocaleString("en-US") + ' Ks</b></span>';
          }).join("");
          paySummaryHtml =
            '<div class="pay-summary-total"><span>' + ssmIcon("card",{size:14}) + ' Online Payment (' + _linkedPays.length + ')</span><span>' + _payTotal.toLocaleString("en-US") + ' Ks</span></div>' +
            '<div class="pay-summary-chips">' + _chips + '</div>';
        }

        // Print badge
        // Shop mode + Delivery Service မရွေးထား (ဆိုင်ရောက်ရောင်း/no-delivery) ဆိုရင်
        // "🖨️ မထုတ်ရသေး" ဟု မပြပါ — Online mode နှင့် Delivery ရွေးထားသော Shop voucher များကို မထိခိုက်စေပါ။
        var _noDeliveryShopVoucher = !!sale.shopMode && !sale.deliveryService;
        let printBadge = sale.printed
          ? `<span class="badge badge-printed">${ssmIcon("print",{size:12})} Print ပြီး</span>`
          : (_noDeliveryShopVoucher ? "" : `<span class="badge badge-notprinted">${ssmIcon("print",{size:12})} မထုတ်ရသေး</span>`);


        // Payment badge
        let payBadge = "";
        let payStatus = sale.payStatus || "COD";
        var _isWI = /-WI-/.test(String(sale.orderNo || "")) || sale.payMode;
        if (_isWI) payStatus = "Cash";   // walk-in (ဆိုင်ရောင်း) = Cash
        var _isShop = !!sale.shopMode;   // created while app was in Shop mode (index.html mode switch)
        if (_isShop && !_isWI) {
          // Shop mode: payStatus က COD/Partial/Prepaid အသုံးပြုထားပေမယ့် အဓိပ္ပါယ်က
          // လက်ငင်း (Cash) / Online & Cash / Fully Online payment ဖြစ်တယ် (index.html အတိုင်း)
          if (payStatus === "Prepaid")      payBadge = `<span class="badge badge-prepaid">Fully Online payment</span>`;
          else if (payStatus === "Partial") payBadge = `<span class="badge badge-partial">Online & Cash</span>`;
          else                              payBadge = `<span class="badge badge-cash">လက်ငင်း (Cash)</span>`;
        }
        else if (payStatus === "Cash")         payBadge = `<span class="badge badge-cash">Cash</span>`;
        else if (payStatus === "Prepaid") payBadge = `<span class="badge badge-prepaid">Prepaid</span>`;
        else if (payStatus === "Partial") payBadge = `<span class="badge badge-partial">ပစ္စည်းဖိုးပြီး</span>`;
        else                              payBadge = `<span class="badge badge-cod">COD</span>`;

        html += `
          <div class="card receipt-card${_isShop ? ' card-shop' : ''}" id="card-${index}" data-status="${payStatus}" data-date="${(sale.orderDate || '').slice(0,10)}">

            <div class="card-summary" onclick="toggleCard(${index})">
              <div class="summary-left">
                <h3>${sale.customer || (_isShop ? "Shop" : "-")}</h3>
                <p>${sale.township || "-"}</p>
                <p>${printBadge} ${payBadge}</p>
              </div>
              <div class="summary-right">
                <div class="net">${getNetNumber(sale)}</div>
                <div class="order-no">${sale.orderNo || ""}</div>
              </div>
            </div>

            <div class="card-detail" id="detail-${index}">
              ${_isShop ? `
              ${sale.phone ? `<p class="info-line"><b>Phone:</b> ${sale.phone}</p>` : ""}
              ${sale.address ? `<p class="info-line"><b>Address:</b> ${sale.address}</p>` : ""}
              ${(sale.receiverName || sale.receiverPhone || sale.receiverAddress) ? `
              <p class="info-line"><b>Receiver Name:</b> ${sale.receiverName || "-"}</p>
              <p class="info-line"><b>Receiver Phone:</b> ${sale.receiverPhone || "-"}</p>
              <p class="info-line"><b>Receiver Address:</b> ${sale.receiverAddress || "-"}</p>` : ""}
              ${sale.orderApp ? `<p class="info-line"><b>Order App:</b> ${sale.orderApp}</p>` : ""}
              ${sale.deliveryService ? `<p class="info-line"><b>Delivery Service:</b> ${sale.deliveryService}</p>` : ""}
              ${sale.staff ? `<p class="info-line"><b>Staff:</b> ${sale.staff}</p>` : ""}
              ` : `
              ${_isWI ? "" : `
              <p class="info-line"><b>Phone:</b> ${sale.phone || "-"}</p>
              <p class="info-line"><b>Address:</b> ${sale.address || "-"}</p>
              ${(sale.receiverName || sale.receiverPhone || sale.receiverAddress) ? `
              <p class="info-line"><b>Receiver Name:</b> ${sale.receiverName || "-"}</p>
              <p class="info-line"><b>Receiver Phone:</b> ${sale.receiverPhone || "-"}</p>
              <p class="info-line"><b>Receiver Address:</b> ${sale.receiverAddress || "-"}</p>` : ""}
              <p class="info-line"><b>Order App:</b> ${sale.orderApp || "-"}</p>
              <p class="info-line"><b>Delivery Service:</b> ${sale.deliveryService || "-"}</p>`}
              <p class="info-line"><b>Staff:</b> ${sale.staff || "-"}</p>
              `}
              <p class="info-line"><b>Grand Total:</b> ${sale.grandTotal || 0}</p>
              ${_isWI ? "" : `<p class="info-line"><b>Delivery Fee:</b> ${sale.delivery || 0}</p>`}
              ${Array.isArray(sale.linkedPayments) ? (_payTotal > 0 ? `<p class="info-line"><b>Deposit:</b> ${_payTotal}</p>` : "") : (Number(sale.deposit) > 0 ? `<p class="info-line"><b>Deposit:</b> ${sale.deposit}</p>` : "")}
              <p class="info-line"><b>Net Total:</b> ${getNetNumber(sale)}</p>

              <div class="items-box">
                ${itemHtml}
              </div>

              <div id="paySummary-${index}" class="pay-summary-box" style="${_linkedPays.length ? '' : 'display:none;'}">${paySummaryHtml}</div>

              <div class="actions">
                <button class="btn btn-onlinepay" onclick="openOnlinePaymentModal(${index})">${ssmIcon("card",{size:14})} Online Payment</button>
                <button class="btn btn-print"   onclick="printReceipt(${index})">${ssmIcon("print", {size:16})} Print</button>
                <button class="btn btn-print"   onclick="shareReceipt(${index}, this)">${ssmIcon("share", {size:16})} Share</button>
                <button class="btn btn-edit"    onclick="editReceipt(${index})">${ssmIcon("edit", {size:16})} Edit</button>
                <button class="btn btn-delete"  onclick="deleteReceipt(${index})">${ssmIcon("trash", {size:16})} Delete</button>
              </div>
            </div>

          </div>`;
      });

      document.getElementById("historyList").innerHTML = html;

      if (openIndex !== null) {
        let detail = document.getElementById("detail-" + openIndex);
        if (detail) detail.style.display = "block";
      }
      applyFilters();
    }

    // ── Net number only ───────────────────────────────────────────
    function getNetNumber(sale) {
      function n(v){ var x = Number(String(v==null?0:v).replace(/[^0-9.\-]/g,"")); return isNaN(x)?0:x; }
      // "Paid so far" — sale.deposit is set once at order creation to the sum of
      // the online payments chosen at that time (index.html), the SAME payments as
      // sale.linkedPayments. Whenever linkedPayments exists as an array (even
      // emptied out after unlinking), use its live total — it stays accurate as
      // payments are added/removed, including going back down to 0. Only fall
      // back to sale.deposit for the older manual/cash-deposit flow that never
      // had a linkedPayments array at all. Checking .length here would wrongly
      // fall back to the stale sale.deposit once every linked payment is unlinked.
      var paid;
      if (Array.isArray(sale.linkedPayments)) {
        var _allPay = JSON.parse(localStorage.getItem("paymentsList")) || [];
        paid = sale.linkedPayments.reduce(function (s, pid) {
          var p = _allPay.find(function (x) { return x.id === pid; });
          if (!p) return s;
          var m = p.allocations;
          if (!m && p.linkedSaleId) { m = {}; m[p.linkedSaleId] = n(p.amount); }
          var share = (m && m[sale.orderNo] != null) ? n(m[sale.orderNo]) : n(p.amount);
          return s + share;
        }, 0);
      } else {
        paid = n(sale.deposit);
      }
      // walk-in (ဆိုင်ရောင်း) — total − discount − paid (deposit/online payment ပေးထားရင် နုတ်)
      if (/-WI-/.test(String(sale.orderNo || "")) || sale.payMode) {
        return n(sale.grandTotal) - n(sale.discountAmount) - paid;
      }
      // total - discount - paid + delivery
      return n(sale.grandTotal) - n(sale.discountAmount) - paid + n(sale.delivery);
    }

    // ── Toggle Card ───────────────────────────────────────────────
    function toggleCard(index) {
      let detail = document.getElementById("detail-" + index);
      if (detail.style.display === "block") {
        detail.style.display = "none";
        openIndex = null;
      } else {
        document.querySelectorAll(".card-detail").forEach(function (d) { d.style.display = "none"; });
        detail.style.display = "block";
        openIndex = index;
      }
    }

    // ── View SS fullscreen ────────────────────────────────────────
    // ── Load More (ရက်ဟောင်း ၂၀ ရက်စီ ထပ်ဆွဲ) ──
    function loadMoreReceipts() {
      var btn = document.getElementById("loadMoreBtn");
      var note = document.getElementById("loadMoreNote");
      if (!window.ssmLoadMoreSales) {
        note.textContent = "Cloud sync မရနိုင်ပါ (internet စစ်ပါ)";
        return;
      }
      btn.disabled = true;
      btn.textContent = "⏳ ဆွဲနေသည် ...";
      note.textContent = "";
      window.ssmLoadMoreSales(function (res) {
        btn.disabled = false;
        btn.innerHTML = ssmIcon("refresh",{size:16}) + " နောက်ထပ် ၂၀ ရက်စာ ကြည့်ရန်";
        if (res && res.error) {
          note.textContent = "မဆွဲနိုင်ပါ — ထပ်ကြိုးစားကြည့်ပါ";
          return;
        }
        if (res && !res.more) {
          document.getElementById("loadMoreWrap").style.display = "none";
          note.textContent = "";
        } else if (res && res.count === 0) {
          note.textContent = "ဒီအပိုင်းမှာ receipt မတွေ့ပါ — ထပ်နှိပ်ကြည့်ပါ";
        }
      });
    }

    function viewSS(index) {
      var sale = salesHistory[index];
      var modal = document.getElementById("ssModal");
      var imgEl = document.getElementById("ssModalImg");
      if (sale.paySS) {
        imgEl.src = sale.paySS;
        modal.style.display = "flex";
        return;
      }
      // local မှာ silent ဖယ်ထားရင် — cloud ကနေ ဆွဲ
      imgEl.removeAttribute("src");
      imgEl.alt = "cloud ကနေ ဆွဲနေသည် ...";
      modal.style.display = "flex";
      if (window.ssmGetCloudImages) {
        window.ssmGetCloudImages(sale.orderNo).then(function (imgs) {
          if (imgs && imgs.paySS) imgEl.src = imgs.paySS;
          else imgEl.alt = "ပုံ မတွေ့ပါ — internet စစ်ပါ / Backup မှာ ကြည့်ပါ";
        });
      } else {
        imgEl.alt = "cloud sync မရနိုင်ပါ";
      }
    }
    function closeSS() {
      document.getElementById("ssModal").style.display = "none";
    }

    // ── Delete ────────────────────────────────────────────────────
    function deleteReceipt(index) {
      if ((localStorage.getItem('ssm_role')||'staff') !== 'admin') { alert('Admin မှ ဖျက်လို့ရပါတယ်'); return; }
      var ono = salesHistory[index] ? salesHistory[index].orderNo : null;
      showConfirm("ဒီ Receipt ကို ဖျက်မှာလား?", function () {
        salesHistory = JSON.parse(localStorage.getItem("salesHistory")) || [];   // fresh (index ရွှေ့မှု safe)
        var di = (ono != null) ? salesHistory.findIndex(function (s) { return s && String(s.orderNo) === String(ono); }) : index;
        if (di >= 0) salesHistory.splice(di, 1);
        localStorage.setItem("salesHistory", JSON.stringify(salesHistory));

        // Receipt ဖျက်လိုက်ရင် ဒီ receipt နဲ့ ချိတ်ထားတဲ့ payment(s) ကို
        // ပြန်ဖြေလိုက် (linkedSaleId ဖျက်) — မဟုတ်ရင် payment ဟာ "locked"
        // အဖြစ် ဆက်ကျန်ပြီး နောက် order တစ်ခုနဲ့ ပြန်ချိတ်လို့ မရတော့ပါ။
        if (ono != null) {
          var _pay = JSON.parse(localStorage.getItem("paymentsList")) || [];
          var _payChanged = false;
          _pay.forEach(function (p) {
            if (!p) return;
            var m = p.allocations;
            if (!m && p.linkedSaleId) { m = {}; m[p.linkedSaleId] = Number(p.amount) || 0; }
            if (m && m[ono] != null) {
              delete m[ono];
              p.allocations = m;
              delete p.linkedSaleId;
              _payChanged = true;
            } else if (String(p.linkedSaleId) === String(ono)) {
              delete p.linkedSaleId;
              _payChanged = true;
            }
          });
          if (_payChanged) localStorage.setItem("paymentsList", JSON.stringify(_pay));
        }

        openIndex = null;
        renderHistory();
      });
    }

    // ── Edit ──────────────────────────────────────────────────────
    function editReceipt(index) {
      localStorage.setItem("editReceiptIndex", index);
      if (salesHistory[index]) localStorage.setItem("editReceiptOrderNo", salesHistory[index].orderNo);   // orderNo နဲ့ index.html မှာ ပြန်ရှာ
      location.href = "index.html";
    }

    // ── Search ────────────────────────────────────────────────────
    function applyFilters() {
      var kw = (document.getElementById("searchBox").value || "").toLowerCase();

      document.querySelectorAll(".receipt-card").forEach(function (card) {
        var passText = (card.textContent || "").toLowerCase().includes(kw);
        card.style.display = passText ? "block" : "none";
      });
    }


    // Receipt template moved to shared receipt.js (ssmRenderReceipt) — single source of truth.

    // ── Print ─────────────────────────────────────────────────────
    function printReceipt(index) {
      salesHistory[index].printed = true;
      localStorage.setItem("salesHistory", JSON.stringify(salesHistory));
      localStorage.setItem("printReceipt", JSON.stringify(salesHistory[index]));
      location.href = "print.html";
    }

    // ── Share (receipt.js — ssmShareReceipt) ─────────────────────
    function shareReceipt(index, btn) {
      if (!salesHistory[index]) return;
      window.ssmShareReceipt(salesHistory[index], { button: btn });
    }

    // ── Online Payment: modal embedding payments.html (same UI as index.html) ──
    var _onlinePayIndex = null;

    function openOnlinePaymentModal(index) {
      _onlinePayIndex = index;
      var sale = salesHistory[index];
      if (!sale) return;
      var overlay = document.getElementById("onlinePayModalOverlay");
      var frame = document.getElementById("onlinePayModalFrame");
      if (!overlay || !frame) return;
      var preIds = (sale.linkedPayments || []).join(",");
      // "&t=" busts the iframe cache so payments.html always re-reads localStorage fresh.
      frame.src = "payments.html?select=1&sale=" + encodeURIComponent(sale.orderNo || "") +
        "&pre=" + encodeURIComponent(preIds) + "&t=" + Date.now();
      overlay.style.display = "flex";
      requestAnimationFrame(function () { overlay.classList.add("show"); });
      document.body.style.overflow = "hidden";
    }

    function closeOnlinePaymentModal() {
      var overlay = document.getElementById("onlinePayModalOverlay");
      var frame = document.getElementById("onlinePayModalFrame");
      if (!overlay) return;
      overlay.classList.remove("show");
      document.body.style.overflow = "";
      setTimeout(function () {
        overlay.style.display = "none";
        if (frame) frame.src = "about:blank";
      }, 320); // matches .pay-modal-sheet transition duration
    }

    // Messages from the embedded payments.html (select mode)
    window.addEventListener("message", function (ev) {
      var d = ev && ev.data;
      if (!d || d.source !== "ssm-payments") return;
      if (d.type === "selected") {
        if (_onlinePayIndex !== null && salesHistory[_onlinePayIndex]) {
          var chosen = Array.isArray(d.payments) ? d.payments : [];
          salesHistory[_onlinePayIndex].linkedPayments = chosen.map(function (p) { return p.id; });
          localStorage.setItem("salesHistory", JSON.stringify(salesHistory));
        }
        closeOnlinePaymentModal();
        renderHistory();
      } else if (d.type === "cancel") {
        closeOnlinePaymentModal();
      }
    });

    // ── Init ──────────────────────────────────────────────────────
    renderHistory();

  
    // ── Slide Menu ──
    function openMenu() {
      document.getElementById("sideMenu").classList.add("open");
      document.getElementById("menuOverlay").classList.add("open");
    }
    function closeMenu() {
      document.getElementById("sideMenu").classList.remove("open");
      document.getElementById("menuOverlay").classList.remove("open");
    }
    // active page highlight
    (function () {
      let path = location.pathname.split("/").pop() || "index.html";
      document.querySelectorAll(".menu-item").forEach(function (m) {
        if (m.dataset.page === path) m.classList.add("active");
      });
    })();

  </script>
  <script>
  /* ── Styled popup: replaces native alert(), adds showConfirm() ── */
  (function () {
    var ov = document.createElement("div");
    ov.className = "popup-overlay";
    ov.innerHTML =
      '<div class="popup-card" role="dialog" aria-modal="true">' +
        '<div class="popup-icon" id="popIcon"></div>' +
        '<p class="popup-msg" id="popMsg"></p>' +
        '<div class="popup-actions" id="popActions"></div>' +
      '</div>';
    document.body.appendChild(ov);
    var msgEl = ov.querySelector("#popMsg"), iconEl = ov.querySelector("#popIcon"), actEl = ov.querySelector("#popActions");
    function close(){ ov.classList.remove("show"); }
    function pickIcon(m){ m=String(m);
      if (/✅|ပြီး|success/i.test(m)) return "checkCircle";
      if (/⚠|မ|ပါ|error|fail/i.test(m)) return "warning";
      return "help"; }
    window.alert = function (message){
      msgEl.textContent = message; msgEl.style.whiteSpace = "normal"; iconEl.innerHTML = window.ssmIcon(pickIcon(message), {size:28}); actEl.innerHTML = "";
      var ok = document.createElement("button"); ok.textContent = "ရပြီ"; ok.onclick = close;
      actEl.appendChild(ok); ov.classList.add("show"); ok.focus();
    };
    window.showConfirm = function (message, onYes, onNo, opts){
      opts = opts || {};
      msgEl.textContent = message; msgEl.style.whiteSpace = "pre-line"; iconEl.innerHTML = window.ssmIcon(opts.icon || "help", {size:28}); actEl.innerHTML = "";
      var cancel = document.createElement("button"); cancel.className = "popup-cancel";
      cancel.textContent = opts.no || "မလုပ်တော့"; cancel.onclick = function(){ close(); if(onNo) onNo(); };
      var yes = document.createElement("button"); yes.textContent = opts.yes || "ဟုတ်ကဲ့";
      yes.onclick = function(){ close(); if(onYes) onYes(); };
      actEl.appendChild(cancel); actEl.appendChild(yes); ov.classList.add("show");
    };
    window.showPrompt = function (message, onSubmit, onCancel, opts){
      opts = opts || {};
      var ov2 = document.createElement("div"); ov2.className = "popup-overlay";
      ov2.innerHTML = '<div class="popup-card" role="dialog" aria-modal="true">' +
        '<p class="popup-msg" style="white-space:pre-line"></p>' +
        '<input class="popup-input" style="width:100%;margin:2px 0 14px;padding:11px 12px;font-size:15px;border-radius:11px;font-family:inherit;outline:none;box-sizing:border-box;">' +
        '<div class="popup-actions"></div></div>';
      document.body.appendChild(ov2);
      var m = ov2.querySelector(".popup-msg"), inp = ov2.querySelector(".popup-input"), act = ov2.querySelector(".popup-actions");
      m.textContent = message;
      inp.type = opts.type || "text"; if (opts.inputmode) inp.inputMode = opts.inputmode;
      function done(){ ov2.remove(); }
      var cancel = document.createElement("button"); cancel.className = "popup-cancel"; cancel.textContent = "မလုပ်တော့";
      cancel.onclick = function(){ done(); if (onCancel) onCancel(); };
      var ok = document.createElement("button"); ok.textContent = "အတည်ပြု";
      ok.onclick = function(){ var v = inp.value; done(); if (onSubmit) onSubmit(v); };
      act.appendChild(cancel); act.appendChild(ok);
      ov2.addEventListener("click", function(e){ if (e.target === ov2){ done(); if (onCancel) onCancel(); } });
      inp.addEventListener("keydown", function(e){ if (e.key === "Enter") ok.click(); });
      ov2.classList.add("show");
      setTimeout(function(){ inp.focus(); }, 60);
    };
    ov.addEventListener("click", function (e){ if (e.target === ov) close(); });
  })();
  </script>
