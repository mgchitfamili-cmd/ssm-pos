<!DOCTYPE html>
<html>
<head>
  <title>Income</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>(function(){try{if(localStorage.getItem('ssm_dark')==='1')document.documentElement.classList.add('dark');}catch(e){}})();</script>
  <script src="firebase-init.js"></script>
  <script src="firebase-sync.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6d28d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sone Sone Mommy">
  <link rel="apple-touch-icon" href="icon-180.png">
  <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}</script>
  <style>
    :root{
      --bg:#f4f5f8; --surface:#ffffff; --line:#eaecf1; --line-2:#dcdfe7;
      --ink:#15171c; --ink-2:#5a616e; --ink-3:#8b919e;
      --brand:#6d28d9; --brand-ink:#5b21b6; --brand-tint:#f4f0fe; --brand-line:#e7defb;
      --green:#15803d; --green-tint:#ecfaf1; --green-line:#bfe9cd;
      --red:#dc2626; --red-tint:#fef2f2; --red-line:#f3c5c5;
      --r:16px; --r-sm:11px;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.04);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; }
    body{
      font-family:system-ui,'Noto Sans Myanmar','Padauk','Myanmar Text','Segoe UI',sans-serif;
      background:var(--bg); color:var(--ink); line-height:1.5; padding:0 0 30px 0;
      -webkit-text-size-adjust:100%;
    }

    .top-bar{
      position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
      padding:11px 12px; margin:0; background:rgba(255,255,255,.85);
      backdrop-filter:saturate(150%) blur(10px); -webkit-backdrop-filter:saturate(150%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    #menuBtn{ background:none; border:none; font-size:23px; line-height:1; color:var(--ink);
      cursor:pointer; padding:6px 9px; border-radius:10px;
      -webkit-tap-highlight-color:transparent; outline:none; -webkit-user-select:none; user-select:none; }
    #menuBtn:active{ background:var(--line); }
    #menuBtn:focus, #menuBtn:focus-visible{ outline:none; box-shadow:none; }
    .top-bar .top-title{ margin:0; font-size:18px; font-weight:700; letter-spacing:-.01em; flex:1; }

    /* slide menu */
    #menuOverlay{ display:none; position:fixed; inset:0; background:rgba(15,17,25,.45); z-index:9998; }
    #sideMenu{ position:fixed; top:0; left:-300px; width:284px; height:100%; background:var(--surface);
      z-index:9999; transition:left .25s ease; overflow-y:auto; box-shadow:8px 0 34px rgba(16,24,40,.18); }
    #sideMenu.open{ left:0; }
    #menuOverlay.open{ display:block; }
    .menu-header{ padding:26px 20px 22px; color:#fff; background:linear-gradient(135deg, var(--brand-ink), var(--brand)); }
    .menu-header h2{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em; }
    .menu-header p{ margin:5px 0 0; font-size:12px; color:rgba(255,255,255,.82); }
    .menu-item{ display:flex; align-items:center; gap:13px; margin:5px 8px; padding:9px 11px;
      border-radius:12px; color:var(--ink); cursor:pointer; font-size:15px; font-weight:500; }
    .menu-item:first-of-type{ margin-top:9px; }
    .menu-item:active{ background:var(--line); }
    .menu-item.active{ background:var(--brand-tint); color:var(--brand-ink); font-weight:700; }
    .menu-item .ic{ width:38px; height:38px; flex:none; border-radius:10px; display:flex; align-items:center;
      justify-content:center; font-size:18px; background:var(--brand-tint); border:1px solid var(--brand-line); }
    .menu-item.active .ic{ background:#fff; }

    /* filters */
    .filter-selects{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px 0; }
    .filter-selects select{ width:100%; padding:10px 34px 10px 12px; font-size:14px; line-height:1.45;
      font-family:inherit; color:var(--ink); background-color:var(--surface); border:1px solid var(--line-2);
      border-radius:10px; -webkit-appearance:none; appearance:none; outline:none; cursor:pointer;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b919e' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
      background-repeat:no-repeat; background-position:right 11px center; }
    .filter-selects select:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(109,40,217,.13); }
    .date-range{ display:flex; align-items:center; gap:8px; padding:10px 14px 14px; }
    .date-range .dr-field{ flex:1; min-width:0; display:flex; }
    .dr-box{ position:relative; display:flex; align-items:center; width:100%;
      padding:9px 32px 9px 10px; border-radius:10px; border:1px solid var(--line-2);
      background:var(--surface); font-family:inherit; box-sizing:border-box; font-size:13px;
      overflow:hidden; white-space:nowrap; }
    .dr-box:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(109,40,217,.13); }
    .dr-label{ flex:none; color:var(--ink-3); font-weight:600; }
    .dr-sep{ flex:none; color:var(--line-2); margin:0 6px; }
    .dr-value{ flex:1 1 auto; min-width:0; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; }
    .dr-native{ position:absolute; inset:0; width:100%; height:100%; opacity:0;
      border:0; margin:0; padding:0; font-size:16px; cursor:pointer;
      -webkit-appearance:none; appearance:none; }
    .date-range .dr-clear{ flex:none; width:38px; height:38px; padding:0; border-radius:10px; background:var(--surface);
      color:var(--ink-3); border:1px solid var(--line-2); font-size:15px; cursor:pointer; }

    #dayList{ padding:0 14px; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }

    .day-card{ background:var(--service-gradient, var(--surface)); border:none;
      border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
    .day-head{ display:flex; justify-content:space-between; align-items:center; gap:8px;
      padding:12px 14px 8px; }
    .day-date{ font-size:15px; font-weight:700; color:rgba(255,255,255,.85); }
    .day-count{ font-size:12px; font-weight:600; color:rgba(255,255,255,.75); white-space:nowrap; }
    .day-body{ padding:8px 14px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .day-service{ font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:999px;
      background:rgba(255,255,255,.22); color:#fff;
      border:1px solid rgba(255,255,255,.3); white-space:nowrap; }
    .day-amount{ font-size:26px; font-weight:800; color:#fff; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; }

    .empty-state{ text-align:center; color:var(--ink-3); margin-top:60px; padding:0 30px; font-size:14px; grid-column:1/-1; }

    @media (min-width:700px){
      .filter-selects, .date-range { max-width:920px; margin-left:auto; margin-right:auto; }
      .filter-selects{ margin-top:0; }
      #dayList { max-width:920px; margin-left:auto; margin-right:auto; }
    }

    /* ===== Dark mode ===== */
    html.dark{
      --bg:#0f1116; --surface:#181b22; --line:#252a33; --line-2:#333a46;
      --ink:#e8eaef; --ink-2:#aab1bd; --ink-3:#727a87;
      --brand:#8b5cf6; --brand-ink:#c4b5fd; --brand-tint:#1d1930; --brand-line:#352c57;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
    html.dark .top-bar{ background:rgba(18,20,26,.82); }
    html.dark .filter-selects select, html.dark .dr-box{ background-color:#1e222a; }
    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
  </style>
</head>

<body>

  <!-- Slide Menu -->
  <div id="menuOverlay" onclick="closeMenu()"></div>
  <div id="sideMenu">
    <div class="menu-header">
      <h2>Sone Sone Mommy</h2>
      <p>POS System</p>
    </div>
    <div class="menu-item admin-only" data-page="report.html"   onclick="location.href='report.html'"><span class="ic">📊</span> စာရင်းချုပ်</div>
    <div class="menu-item admin-only" data-page="income.html"   onclick="location.href='income.html'"><span class="ic">💰</span> Delivery ဆီမှရငွေ</div>
    <div class="menu-item" data-page="index.html"    onclick="location.href='index.html'"><span class="ic">🛒</span> အရောင်း (Sales)</div>
    <div class="menu-item" data-page="receipts.html" onclick="location.href='receipts.html'"><span class="ic">🧾</span> ဘောင်ချာများ</div>
    <div class="menu-item" data-page="delivery.html" onclick="location.href='delivery.html'"><span class="ic">🚚</span> ပို့ဆောင်ရေး</div>
    <div class="menu-item" data-page="payments.html" onclick="location.href='payments.html'"><span class="ic">💵</span> ငွေလွှဲစာရင်း</div>
    <div class="menu-item admin-only" data-page="products.html" onclick="location.href='products.html'"><span class="ic">📦</span> ပစ္စည်းများ</div>
    <div class="menu-item admin-only" data-page="staff.html"    onclick="location.href='staff.html'"><span class="ic">👤</span> ဝန်ထမ်းများ</div>
    <div class="menu-item" data-page="setting.html" onclick="location.href='setting.html'"><span class="ic">⚙️</span> Settings</div>
  </div>

  <div class="top-bar">
    <button id="menuBtn" onclick="openMenu()">⋮</button>
    <span class="top-title">Delivery ဆီမှရငွေ</span>
  </div>

  <div class="filter-selects">
    <select id="svcFilter" onchange="renderIncome()">
      <option value="all">🚚 Service — အားလုံး</option>
      <option value="Royal">Royal</option>
      <option value="Ko Nyein Chan Aung">Ko Nyein Chan Aung</option>
      <option value="Ninja Van">Ninja Van</option>
      <option value="Own Rider">Own Rider</option>
    </select>
  </div>
  <div class="date-range">
    <div class="dr-field">
      <div class="dr-box">
        <span class="dr-label">From</span><span class="dr-sep">|</span>
        <span class="dr-value" id="dateFromLabel">Select Date</span>
        <input type="date" id="dateFrom" class="dr-native" onchange="updateDRDateLabel('dateFrom','dateFromLabel'); renderIncome();">
      </div>
    </div>
    <div class="dr-field">
      <div class="dr-box">
        <span class="dr-label">To</span><span class="dr-sep">|</span>
        <span class="dr-value" id="dateToLabel">Select Date</span>
        <input type="date" id="dateTo" class="dr-native" onchange="updateDRDateLabel('dateTo','dateToLabel'); renderIncome();">
      </div>
    </div>
    <button class="dr-clear" onclick="clearDateRange()" aria-label="Clear">✕</button>
  </div>

  <div id="dayList"></div>

  <script>
    // ── Helpers ─────────────────────────────────────────────────
    function fmt(n) {
      n = Math.round(Number(n) || 0);
      return n.toLocaleString("en-US");
    }
    function formatDRDate(iso) {
      if (!iso) return "Select Date";
      var p = iso.split("-");
      if (p.length !== 3) return "Select Date";
      return p[2] + "." + p[1] + "." + p[0];
    }
    function updateDRDateLabel(inputId, labelId) {
      var el = document.getElementById(inputId);
      document.getElementById(labelId).textContent = formatDRDate(el ? el.value : "");
    }
    window.clearDateRange = function () {
      var f = document.getElementById("dateFrom"), t = document.getElementById("dateTo");
      if (f) f.value = ""; if (t) t.value = "";
      updateDRDateLabel("dateFrom", "dateFromLabel");
      updateDRDateLabel("dateTo", "dateToLabel");
      renderIncome();
    };

    // ── Service color assignment ──────────────────────────────────
    // Deterministic palette so each delivery service always maps to the
    // same color, even for services not in the dropdown (Flash, J&T, etc.)
    var SERVICE_PALETTE = [
      "#6d28d9", "#0e7490", "#b45309", "#be123c", "#15803d",
      "#1d4ed8", "#a21caf", "#c2410c", "#0f766e", "#4338ca"
    ];
    function hexToRgb(hex) {
      var v = hex.replace("#", "");
      return { r: parseInt(v.substr(0, 2), 16), g: parseInt(v.substr(2, 2), 16), b: parseInt(v.substr(4, 2), 16) };
    }
    function lighten(rgb, amt) {
      return {
        r: Math.round(rgb.r + (255 - rgb.r) * amt),
        g: Math.round(rgb.g + (255 - rgb.g) * amt),
        b: Math.round(rgb.b + (255 - rgb.b) * amt)
      };
    }
    function serviceColor(name) {
      var str = String(name || "-");
      var hash = 0;
      for (var i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      var hex = SERVICE_PALETTE[hash % SERVICE_PALETTE.length];
      var rgb = hexToRgb(hex);
      var lightRgb = lighten(rgb, 0.42);
      var lightHex = "rgb(" + lightRgb.r + "," + lightRgb.g + "," + lightRgb.b + ")";
      return {
        border: hex,
        tint: "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.16)",
        line: "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.35)",
        gradient: "linear-gradient(135deg, " + hex + " 0%, " + lightHex + " 100%)"
      };
    }

    // ── Core: build grouped income data from salesHistory ───────
    function getDeliveredRecords() {
      var sales = [];
      try { sales = JSON.parse(localStorage.getItem("salesHistory")) || []; } catch (e) {}
      return sales.filter(function (s) {
        return s && s.deliveryStatus === "Delivered" && s.deliveredDate;
      });
    }

    function renderIncome() {
      var svc  = (document.getElementById("svcFilter").value || "all");
      var from = (document.getElementById("dateFrom").value || "");
      var to   = (document.getElementById("dateTo").value || "");

      var records = getDeliveredRecords().filter(function (s) {
        var matchSvc  = (svc === "all") || ((s.deliveredService || "") === svc);
        var matchFrom = !from || s.deliveredDate >= from;
        var matchTo   = !to   || s.deliveredDate <= to;
        return matchSvc && matchFrom && matchTo;
      });

      // Group by deliveredDate + deliveredService — one card per combination
      var groups = {};
      var order = []; // preserves first-seen (date, service) combos for stable sort
      records.forEach(function (s) {
        var date = s.deliveredDate;
        var service = s.deliveredService || "-";
        var key = date + "||" + service;
        if (!groups[key]) {
          groups[key] = { date: date, service: service, total: 0, count: 0 };
          order.push(key);
        }
        groups[key].total += Number(s.deliveredAmount) || 0;
        groups[key].count += 1;
      });

      // Sort: newest delivered date first, then service name alphabetically
      order.sort(function (a, b) {
        var ga = groups[a], gb = groups[b];
        if (ga.date !== gb.date) return ga.date < gb.date ? 1 : -1;
        return ga.service.localeCompare(gb.service);
      });

      var html = "";

      if (order.length === 0) {
        html = '<p class="empty-state">Delivered order မရှိသေးပါ။<br>Order ကို "Delivered" လုပ်တာနဲ့ ဒီစာရင်းမှာ အလိုအလျောက် ပေါ်လာပါမယ်။</p>';
      }

      order.forEach(function (key) {
        var g = groups[key];
        var col = serviceColor(g.service);
        var style = '--service-color:' + col.border + ';' +
                    '--service-tint:' + col.tint + ';' +
                    '--service-line:' + col.line + ';' +
                    '--service-gradient:' + col.gradient + ';';
        html += '<div class="day-card" style="' + style + '">' +
                  '<div class="day-head">' +
                    '<span class="day-date">' + formatDRDate(g.date) + '</span>' +
                    '<span class="day-amount">' + fmt(g.total) + '</span>' +
                  '</div>' +
                  '<div class="day-body">' +
                    '<span class="day-service">🚚 ' + g.service + '</span>' +
                    '<span class="day-count">' + g.count + ' order</span>' +
                  '</div>' +
                '</div>';
      });

      document.getElementById("dayList").innerHTML = html;
    }
    window.renderIncome = renderIncome;

    // ── Init ──────────────────────────────────────────────────────
    renderIncome();

    // Cloud sync ပြီးတိုင်း / တခြား page ကနေ Delivered လုပ်တိုင်း — ချက်ချင်း ပြန် render
    document.addEventListener("ssm-sales-updated", function () { renderIncome(); });
    window.addEventListener("storage", function (e) { if (e.key === "salesHistory") renderIncome(); });
    window.addEventListener("pageshow", function () { renderIncome(); });

    // ── Slide Menu ──
    function openMenu() {
      document.getElementById("sideMenu").classList.add("open");
      document.getElementById("menuOverlay").classList.add("open");
    }
    function closeMenu() {
      document.getElementById("sideMenu").classList.remove("open");
      document.getElementById("menuOverlay").classList.remove("open");
    }
    (function () {
      try {
        var r = localStorage.getItem('ssm_role') || 'staff';
        document.documentElement.classList.add('role-' + r);
        if (r !== 'admin') {
          document.querySelectorAll('.admin-only').forEach(function (e) { e.style.display = 'none'; });
        }
      } catch (e) {}
    })();
    (function () {
      let path = location.pathname.split("/").pop() || "index.html";
      document.querySelectorAll(".menu-item").forEach(function (m) {
        if (m.dataset.page === path) m.classList.add("active");
      });
    })();
  </script>
  <script src="menu-logo.js"></script>
</body>
</html>
